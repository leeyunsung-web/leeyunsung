<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Private Preview — LEE YUNSUNG</title>
<style>
@font-face{font-family:"LYS Sans";font-weight:400;font-display:swap;src:url(/fonts/lys-sans-400.woff2) format("woff2")}
@font-face{font-family:"LYS Sans";font-weight:700;font-display:swap;src:url(/fonts/lys-sans-700.woff2) format("woff2")}
:root{--ink:#111;--soft:#6b6b6b;--line:#e4e4e4;--bg:#fff;--paper:#f3f2ef;--ok:#1d7a3a;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"LYS Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:44px 20px 72px}
.brand{font-weight:700;letter-spacing:.32em;font-size:15px;margin:0}
.brand a{color:inherit;text-decoration:none}
.kicker{display:flex;justify-content:space-between;gap:12px;color:var(--soft);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:8px 0 30px}
.hello{font-size:15px;line-height:1.65;margin:0 0 26px}
.hero{width:100%;display:block;background:var(--paper)}
h1{font-size:24px;font-weight:400;margin:26px 0 6px;line-height:1.3}
.cap{color:var(--soft);font-size:14px;line-height:1.7;margin:0}
.desc{font-size:15px;line-height:1.75;margin:20px 0 0}
.gal{display:flex;flex-direction:column;gap:14px;margin:30px 0 0}
.gal figure{margin:0}
.gal img,.gal video{width:100%;display:block;background:var(--paper)}
.gal figcaption{color:var(--soft);font-size:12px;margin-top:6px}
.offer{border-top:2px solid var(--ink);margin-top:38px;padding-top:8px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .k{color:var(--soft)}
.row .v{text-align:right}
.price{display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);padding:18px 16px;margin:22px 0 8px}
.price b{font-size:24px;font-weight:700}
.small{font-size:12.5px;color:var(--soft);line-height:1.6;margin:6px 0 0}
form{margin-top:24px;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--soft)}
input,textarea{font:inherit;font-size:15px;border:1px solid var(--line);padding:11px 12px;width:100%;background:#fff;color:var(--ink);border-radius:0}
textarea{min-height:84px;resize:vertical}
button{font:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;background:var(--ink);color:#fff;border:0;padding:15px 16px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;line-height:1.6;margin:10px 0 0}
.msg.err{color:var(--bad)}
.done{background:var(--paper);padding:22px 18px;margin-top:22px;font-size:15px;line-height:1.7}
.done .tick{color:var(--ok);font-size:22px;margin-right:6px}
.foot{margin-top:44px;color:var(--soft);font-size:12px;line-height:1.7}
.foot a{color:inherit}
.gate{padding:60px 0;text-align:center;color:var(--soft);font-size:15px;line-height:1.7}
.sample{background:#111;color:#fff;font-size:12.5px;letter-spacing:.04em;padding:9px 12px;margin:0 0 20px}
#pp{min-height:110px;margin-top:14px}
.alt{background:none;border:0;color:var(--soft);font-size:13px;font-weight:400;letter-spacing:0;text-decoration:underline;padding:6px 0;cursor:pointer;text-align:left}
.terms{font-size:11.5px;line-height:1.55;color:var(--soft);margin:12px 0 0}
</style>
</head>
<body>
<main>
  <p class="brand"><a href="/en/">LEE YUNSUNG</a></p>
  <div class="kicker"><span>Private Preview</span><span id="ends"></span></div>
  <div id="app"><p class="gate">Loading…</p></div>
  <p class="foot">This page is shared privately with invited collectors and friends of the studio. Please keep the link to yourself.<br>
  Questions: <a href="mailto:reyunsung@gmail.com">reyunsung@gmail.com</a></p>
</main>
<script>
(function(){
  var API = "https://leeyunsung-shop.nu-layer.workers.dev";
  var key = (location.hash || "").replace(/^#/, "").replace(/[^A-Za-z0-9]/g, "");
  var peek = /[?&]m=1/.test(location.search);
  var app = document.getElementById("app");
  function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function usd(n){ return "USD " + Number(n || 0).toLocaleString("en-US"); }
  function day(t){ return new Date(t).toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"}); }
  function gate(t){ app.innerHTML = '<p class="gate">' + esc(t) + '</p>'; }
  /* 익명 방문 기록 (홈페이지와 같은 /api/t) — 마스터 기기는 빼고, 이름·키는 보내지 않음 */
  var TQ = [], TT = null, TSTART = 0;
  function toff(){ try{ if(localStorage.getItem("lysNoTrack") === "1") return true; }catch(e){} return peek || !!navigator.webdriver; }
  function tflush(){
    clearTimeout(TT); TT = null; if(!TQ.length) return;
    var sid = ""; try{ sid = sessionStorage.getItem("lysSid") || ""; if(!sid){ sid = Math.random().toString(36).slice(2, 10); sessionStorage.setItem("lysSid", sid); } }catch(e){}
    var ref = ""; try{ if(!sessionStorage.getItem("lysTS")){ sessionStorage.setItem("lysTS", "1"); TQ.unshift(["session", "preview", "", 0]); var u = new URL(document.referrer); if(!/leeyunsung/i.test(u.host)) ref = u.host.replace(/^www\./, ""); } }catch(e){}
    var body = JSON.stringify({ ev: TQ.splice(0, 40), l: "en", r: ref, s: sid });
    try{ if(!(navigator.sendBeacon && navigator.sendBeacon(API + "/api/t", new Blob([body], { type: "text/plain" })))) fetch(API + "/api/t", { method: "POST", body: body, keepalive: true }).catch(function(){}); }catch(e){}
  }
  function track(t, k, n, now){ if(toff()) return; TQ.push([t, "preview", String(k || "").slice(0, 120), n || 0]); if(now) tflush(); else if(!TT) TT = setTimeout(tflush, 3000); }
  addEventListener("pagehide", function(){ if(TSTART){ var sec = Math.round((Date.now() - TSTART) / 1000); if(sec >= 2) track("time", "", Math.min(sec, 1800)); TSTART = 0; } tflush(); });

  if(!key || key.length < 12){ gate("This preview is by invitation only."); return; }

  fetch(API + "/api/preview/" + key + (peek ? "?peek=1" : "")).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); }).then(function(res){
    var d = res.j;
    if(!res.ok){ gate(d && d.message || "This preview is by invitation only."); return; }
    if(d.sample) peek = true;
    TSTART = Date.now(); track("view", "Private preview: " + d.title, 0, true);
    if(d.endsAt) document.getElementById("ends").textContent = (d.open ? "Until " : "Ended ") + day(d.endsAt);
    var ph = d.photos || [], hero = ph[0], rest = ph.slice(1);
    var h = (d.sample ? '<p class="sample">SAMPLE VIEW · 견본 화면입니다. 결제와 예약은 실제로 진행되지 않아요.</p>' : '') + (d.name ? '<p class="hello">Dear ' + esc(d.name) + ',<br>thank you for your interest in my work. You are invited to see this new edition before its public release.</p>' : '<p class="hello">Thank you for your interest in my work. You are invited to see this new edition before its public release.</p>') +
      (hero ? '<img class="hero" src="' + esc(hero.image) + '" alt="' + esc(d.title) + '">' : '') +
      '<h1>' + esc(d.title) + (d.year ? ', ' + esc(d.year) : '') + '</h1>' +
      '<p class="cap">' + [d.spec2, d.spec1, d.edition].filter(Boolean).map(esc).join('<br>') + '</p>' +
      (d.description ? '<p class="desc">' + esc(d.description) + '</p>' : '') +
      '<div class="gal">' + rest.map(function(p){
        var m = p.video ? '<video src="' + esc(p.video) + '" poster="' + esc(p.image) + '" muted loop playsinline autoplay preload="metadata"></video>' : '<img src="' + esc(p.image) + '" alt="" loading="lazy">';
        return '<figure>' + m + (p.caption ? '<figcaption>' + esc(p.caption) + '</figcaption>' : '') + '</figure>';
      }).join('') + '</div>' +
      '<div class="offer">' +
        '<div class="row"><span class="k">Edition</span><span class="v">' + esc(d.edition || '') + '</span></div>' +
        (d.numbers ? '<div class="row"><span class="k">Offered in this preview</span><span class="v">Numbers ' + esc(d.numbers) + '</span></div>' : '') +
        '<div class="row"><span class="k">Preview price</span><span class="v">' + usd(d.priceUsd) + '</span></div>' +
        '<div class="row"><span class="k">Balance, due before shipping</span><span class="v">' + usd(d.priceUsd - d.deposit) + ' + shipping</span></div>' +
        '<div class="price"><span>Deposit due now (50%)</span><b>' + usd(d.deposit) + '</b></div>' +
        '<p class="small">Each piece is made to order. The deposit reserves your number and begins production; numbers are assigned in the order deposits arrive. Shipping is quoted for your country and added to the balance before shipping.</p>' +
        '<div id="act"></div>' +
      '</div>';
    app.innerHTML = h;
    var act = document.getElementById("act");
    function done(msg){ act.innerHTML = '<div class="done"><span class="tick">✓</span>' + msg + '<br><span class="small">— Lee Yunsung</span></div>'; }
    if(d.paid){ done("Your deposit has been received. Thank you — I will keep you updated as your edition is made."); return; }
    if(!d.open){ act.innerHTML = '<p class="msg">The preview period has ended. If you are still interested, please email <a href="mailto:reyunsung@gmail.com">reyunsung@gmail.com</a>.</p>'; return; }
    act.innerHTML = '<form id="f" onsubmit="return false"><label for="c">Shipping country</label><input id="c" autocomplete="country-name" placeholder="e.g. United States"></form>' +
      '<div id="pp"></div><p id="m" class="msg"></p>' +
      '<p class="terms">Each work is made to order, and production begins once payment is received. For this reason, payments are non-refundable, including if the order is canceled later.</p>' +
      '<button class="alt" id="alt" type="button">Prefer a bank transfer, or have a question first? Send a reservation request instead</button><div id="rf"></div>';
    var cIn = document.getElementById("c"), mEl = document.getElementById("m");
    function note(t, err){ mEl.textContent = t || ""; mEl.className = "msg" + (err ? " err" : ""); }
    document.getElementById("alt").onclick = function(){
      var rf = document.getElementById("rf"); if(rf.innerHTML) return;
      rf.innerHTML = '<form id="rq"><label for="n">Message</label><textarea id="n" placeholder="Anything you would like me to know"></textarea><button type="submit" id="b">Send reservation request</button><p id="m2" class="msg"></p></form>';
      document.getElementById("rq").onsubmit = function(e){
        e.preventDefault(); var b = document.getElementById("b"), m2 = document.getElementById("m2"); b.disabled = true;
        fetch(API + "/api/preview/" + key + "/reserve", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({country:cIn.value, note:document.getElementById("n").value})})
          .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j && j.message || "Something went wrong."); return j; }); })
          .then(function(){ track("inquiry_send", "Preview reservation: " + d.title, 0, true); done("Thank you. Your reservation request has been received. I will be in touch shortly."); })
          .catch(function(err){ b.disabled = false; m2.className = "msg err"; m2.textContent = (err && err.message) || "Something went wrong."; });
      };
    };
    if(d.sample){ document.getElementById("pp").innerHTML = '<div style="height:110px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:13px">PayPal / card payment buttons appear here</div>'; return; }
    var sdk = document.createElement("script");
    sdk.src = "https://www.paypal.com/sdk/js?client-id=" + encodeURIComponent(d.clientId) + "&currency=USD&intent=capture&components=buttons&enable-funding=card&disable-funding=paylater,venmo";
    sdk.onerror = function(){ note("PayPal could not be loaded. Please check your connection or try another browser.", true); };
    sdk.onload = function(){
      paypal.Buttons({
        style:{ layout:"vertical", color:"black", shape:"rect", label:"pay" },
        onClick: function(data, actions){
          if(!cIn.value.trim()){ note("Please enter your shipping country first.", true); cIn.focus(); return actions.reject(); }
          note(""); track("pay_open", "preview deposit " + (data && data.fundingSource || ""), Math.round(d.deposit), true); return actions.resolve();
        },
        createOrder: function(){
          return fetch(API + "/api/preview/" + key + "/order", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({country:cIn.value})})
            .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j && j.message || "Could not start the payment."); return j.id; }); });
        },
        onApprove: function(data, actions){
          note("Completing your payment…");
          return fetch(API + "/api/preview/" + key + "/capture/" + data.orderID, {method:"POST"}).then(function(r){ return r.json().then(function(j){
            if(r.ok && j.ok){
              track("purchase", "preview-deposit", Math.round(Number(j.amount) || 0), true);
              done("Thank you. Your deposit of <b>" + usd(j.amount) + "</b> has been received" + (j.edition ? ", and edition <b>No. " + esc(j.edition) + "</b> is reserved for you" : "") + ". A receipt will arrive from PayPal by email, and I will keep you updated as your edition is made.");
              return;
            }
            if(j && j.restart) return actions.restart();
            track("pay_fail", (j && j.error) || "capture", 0, true);
            note(j && j.message || "Payment could not be completed. You have not been charged.", true);
          }); }).catch(function(){ note("The connection was interrupted. Please check your PayPal account before trying again, or email reyunsung@gmail.com.", true); });
        },
        onCancel: function(){ track("pay_fail", "cancel", 0, true); },
        onError: function(e){ track("pay_fail", "error", 0, true); note((e && e.message) || "Something went wrong with PayPal. You have not been charged.", true); }
      }).render("#pp");
    };
    document.head.appendChild(sdk);
  }).catch(function(){ gate("We couldn't load this page. Please try again in a moment."); });
})();
</script>
</body>
</html>
