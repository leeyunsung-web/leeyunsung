<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Payment — LEE YUNSUNG</title>
<style>
@font-face{font-family:"LYS Sans";font-weight:400;font-display:swap;src:url(/fonts/lys-sans-400.woff2) format("woff2")}
@font-face{font-family:"LYS Sans";font-weight:700;font-display:swap;src:url(/fonts/lys-sans-700.woff2) format("woff2")}
:root{--ink:#111;--soft:#666;--line:#e4e4e4;--bg:#fff;--ok:#1d7a3a;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"LYS Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:48px 20px 64px}
.brand{font-weight:700;letter-spacing:.32em;font-size:15px;margin:0}
.brand a{color:inherit;text-decoration:none}
.sub{color:var(--soft);font-size:12.5px;margin:6px 0 34px;letter-spacing:.04em}
h1{font-size:22px;font-weight:400;margin:0 0 4px}
.muted{color:var(--soft);font-size:13px}
.card{border-top:2px solid var(--ink);margin-top:24px;padding-top:6px}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .k{color:var(--soft)}
.row .v{text-align:right}
.due{display:flex;justify-content:space-between;align-items:baseline;background:#f3f2ef;padding:16px 16px;margin:22px 0 26px}
.due b{font-size:22px}
#pp{min-height:120px}
.opt{display:flex;flex-direction:column;gap:8px;margin:-10px 0 22px}
.opt label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:12px 14px;cursor:pointer;font-size:14px}
.opt label.on{border-color:var(--ink)}
.opt input{accent-color:#111;margin:0}
.opt .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.terms{font-size:11.5px;line-height:1.55;color:var(--soft);margin:14px 0 0}
.msg{font-size:14px;line-height:1.55;margin:18px 0 0}
.msg.err{color:var(--bad)}
.done{text-align:center;padding:30px 0}
.done .tick{font-size:34px;color:var(--ok)}
.foot{margin-top:38px;color:var(--soft);font-size:12px;line-height:1.6}
.foot a{color:inherit}
</style>
</head>
<body>
<main>
  <p class="brand"><a href="/en/">LEE YUNSUNG</a></p>
  <p class="sub">NUTYPE · leeyunsung.com</p>
  <div id="app"><p class="muted">Loading your invoice…</p></div>
  <p class="foot">Payments are processed securely by PayPal. You can pay with a PayPal account or a credit or debit card.<br>
  Questions: <a href="mailto:reyunsung@gmail.com">reyunsung@gmail.com</a></p>
</main>
<script>
(function(){
  var API = "https://leeyunsung-shop.nu-layer.workers.dev";
  var key = (location.hash || "").replace(/^#/, "").replace(/[^A-Za-z0-9]/g, "");
  var app = document.getElementById("app");
  function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function usd(n){ return "USD " + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function fail(t){ app.innerHTML = '<h1>Payment</h1><p class="msg err">' + esc(t) + '</p>'; }
  function note(t, err){ var m = document.getElementById("msg"); if(m){ m.textContent = t || ""; m.className = "msg" + (err ? " err" : ""); } }
  /* 익명 방문 기록 (홈페이지와 같은 방식, /api/t) — 마스터 모드 기기는 빼고, 키는 보내지 않음 */
  var TQ = [], TT = null, TPATH = "pay", TSTART = 0;
  function toff(){ try{ if(localStorage.getItem("lysNoTrack") === "1") return true; }catch(e){} return !!navigator.webdriver; }
  function tflush(){
    clearTimeout(TT); TT = null; if(!TQ.length) return;
    var sid = ""; try{ sid = sessionStorage.getItem("lysSid") || ""; if(!sid){ sid = Math.random().toString(36).slice(2, 10); sessionStorage.setItem("lysSid", sid); } }catch(e){}
    var ref = ""; try{ if(!sessionStorage.getItem("lysTS")){ sessionStorage.setItem("lysTS", "1"); TQ.unshift(["session", TPATH, "", 0]); var u = new URL(document.referrer); if(!/leeyunsung/i.test(u.host)) ref = u.host.replace(/^www\./, ""); } }catch(e){}
    var body = JSON.stringify({ ev: TQ.splice(0, 40), l: "en", r: ref, s: sid });
    try{ if(!(navigator.sendBeacon && navigator.sendBeacon(API + "/api/t", new Blob([body], { type: "text/plain" })))) fetch(API + "/api/t", { method: "POST", body: body, keepalive: true }).catch(function(){}); }catch(e){}
  }
  function track(t, k, n, now){ if(toff()) return; TQ.push([t, TPATH, String(k || "").slice(0, 120), n || 0]); if(now) tflush(); else if(!TT) TT = setTimeout(tflush, 3000); }
  function tview(id){ TPATH = "pay/" + id; TSTART = Date.now(); track("view", "Invoice " + id, 0, true); }
  addEventListener("pagehide", function(){ if(TSTART){ var sec = Math.round((Date.now() - TSTART) / 1000); if(sec >= 2) track("time", "", Math.min(sec, 1800)); TSTART = 0; } tflush(); });

  if(!key || key.length < 16){ fail("This payment link is not complete. Please use the full link you received."); return; }

  fetch(API + "/api/pay/" + key).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); }).then(function(res){
    var d = res.j;
    if(!res.ok){ fail(d && d.message || "This payment link is not valid."); return; }
    tview(d.id);
    var stageName = d.stage === "balance" ? "Balance" : "Deposit";
    var html = '<h1>Invoice ' + esc(d.id) + '</h1><p class="muted">' + (d.buyer ? "For " + esc(d.buyer) + " · " : "") + esc(d.date || "") + '</p>' +
      '<div class="card">' +
      '<div class="row"><span class="k">Artwork</span><span class="v">' + esc(d.item) + (d.edition ? '<br><span class="muted">Edition No. ' + esc(d.edition) + '</span>' : '') + '</span></div>' +
      '<div class="row"><span class="k">Invoice total<br><span class="muted">incl. shipping and insurance</span></span><span class="v">' + usd(d.total) + '</span></div>' +
      (d.deposit ? '<div class="row"><span class="k">Deposit (50%)</span><span class="v">' + usd(d.deposit) + '</span></div>' : '') +
      (d.balance ? '<div class="row"><span class="k">Balance, due before shipping</span><span class="v">' + usd(d.balance) + '</span></div>' : '') +
      '</div>';
    if(d.paid){
      app.innerHTML = html + '<div class="done"><div class="tick">✓</div><p>The ' + stageName.toLowerCase() + ' for this invoice has been received.<br>Thank you.</p></div>';
      return;
    }
    var full = false, canFull = Number(d.fullAmount) > Number(d.amount);
    app.innerHTML = html + '<div class="due"><span id="dueLab">' + stageName + ' due now</span><b id="dueAmt">' + usd(d.amount) + '</b></div>' +
      (canFull ? '<div class="opt"><label class="on"><input type="radio" name="pf" value="part" checked> Pay the ' + stageName.toLowerCase() + ' now<span class="amt">' + usd(d.amount) + '</span></label>' +
        '<label><input type="radio" name="pf" value="full"> Pay in full<span class="amt">' + usd(d.fullAmount) + '</span></label></div>' : '') +
      '<div id="pp"></div><p id="msg" class="msg"></p>' +
      '<p class="terms">Each work is made to order, and production begins once payment is received. For this reason, payments are non-refundable, including if the order is canceled later.</p>';
    Array.prototype.forEach.call(document.querySelectorAll('input[name="pf"]'), function(r){ r.onchange = function(){
      full = r.value === "full" && r.checked;
      Array.prototype.forEach.call(document.querySelectorAll('.opt label'), function(l){ l.classList.toggle("on", l.querySelector("input").checked); });
      document.getElementById("dueLab").textContent = full ? "Total due now" : stageName + " due now";
      document.getElementById("dueAmt").textContent = usd(full ? d.fullAmount : d.amount);
    }; });
    var s = document.createElement("script");
    s.src = "https://www.paypal.com/sdk/js?client-id=" + encodeURIComponent(d.clientId) + "&currency=USD&intent=capture&components=buttons&enable-funding=card&disable-funding=paylater,venmo";
    s.onerror = function(){ note("PayPal could not be loaded. Please check your connection or try another browser.", true); };
    s.onload = function(){
      paypal.Buttons({
        style:{ layout:"vertical", color:"black", shape:"rect", label:"pay" },
        onClick: function(data){ track("pay_open", (full ? "full " : (d.stage || "deposit") + " ") + (data && data.fundingSource || ""), Math.round(full ? d.fullAmount : d.amount), true); },
        createOrder: function(){
          note("");
          return fetch(API + "/api/pay/" + key + "/order", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({full:full})}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j && j.message || "Could not start the payment."); return j.id; }); });
        },
        onApprove: function(data, actions){
          note("Completing your payment…");
          return fetch(API + "/api/pay/" + key + "/capture/" + data.orderID, {method:"POST"}).then(function(r){ return r.json().then(function(j){
            if(r.ok && j.ok){
              track("purchase", "inv-" + d.id + "-" + (full ? "full" : d.stage), Math.round(Number(j.amount) || 0), true);
              app.innerHTML = html + '<div class="done"><div class="tick">✓</div><p>Thank you. Your payment of <b>' + usd(j.amount) + '</b> has been received.</p><p class="muted">A receipt will arrive from PayPal by email. I will be in touch shortly.<br>— Lee Yunsung</p></div>';
              return;
            }
            if(j && j.restart) return actions.restart();
            track("pay_fail", (j && j.error) || "capture", 0, true);
            note(j && j.message || "Payment could not be completed. You have not been charged.", true);
          }); }).catch(function(){ note("The connection was interrupted. Please check your PayPal account before trying again, or email reyunsung@gmail.com.", true); });
        },
        onCancel: function(){ track("pay_fail", "cancel", 0, true); },
        onError: function(e){ track("pay_fail", "error", 0, true); note((e && e.message) || "Something went wrong with PayPal. You have not been charged.", true); }
      }).render("#pp");
    };
    document.head.appendChild(s);
  }).catch(function(){ fail("We couldn't load this invoice. Please try again in a moment."); });
})();
</script>
</body>
</html>
