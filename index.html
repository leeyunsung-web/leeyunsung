  @font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/Pretendard-Regular.subset.woff2) format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:600 700;font-style:normal;font-display:swap;src:url(/fonts/Pretendard-SemiBold.subset.woff2) format("woff2");}
  @font-face{font-family:"EB Garamond";font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/eb-garamond-latin-400-normal.woff2) format("woff2");}
  @font-face{font-family:"EB Garamond";font-weight:500 700;font-style:normal;font-display:swap;src:url(/fonts/eb-garamond-latin-500-normal.woff2) format("woff2");}
  @font-face{font-family:"IBM Plex Mono";font-weight:400 700;font-style:normal;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");}
  :root{
    --bg:#ffffff;
    --ink:#111111;
    --ink-soft:#555555;
    --ink-faint:#999999;
    --line:#e2e2e2;
    --line-strong:#cfcfcf;
    --accent:#111111;
    --sans:"LYS Sans","Pretendard",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --sans-helvetica:"LYS Sans","Pretendard","Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --active-font-family:"Pretendard","LYS Sans",sans-serif;
    
    --fx:clamp(0px, calc(100vw - 1440px), 1440px);
    --content-max-width:640px;
    --ui-font-style:normal;
    --mono:"IBM Plex Mono","Pretendard","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --content-font-size:calc(15px + var(--fx) * 0.005729);
    --content-letter-spacing:0em;
    --content-font-weight:400;
    --content-text-align:left;
    --page-padding:32px;
    --frame-gap:28px;
    --frame-cols:2;
    --detail-margin:32px;
    --caption-font-size:calc(12px + var(--fx) * 0.004583);
    --frame-title-size:14px;
    --text-list-title-size:21px;
    --text-list-top-space:40px;
    --text-list-item-gap:22px;
    --contact-font-size:calc(23px + var(--fx) * 0.008785);
    --contact-top-space:24px;
    --photo-gap:16px;
  }
  
  body{word-break:keep-all; overflow-wrap:break-word;}
  p, li, dd, .detail-desc, .cv-text, .cv-statement, .privacy-body, .pd-desc, .book-desc, .orig-desc, .shop-biz, .cart-fine, .inq-box{text-wrap:pretty;}
  h1, h2, h3, .pd-title{text-wrap:balance;}
  .detail-desc [lang="en"], .cv-text [lang="en"], .cv-statement [lang="en"], .pd-desc [lang="en"]{-webkit-hyphens:auto; hyphens:auto;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink); overflow-x:hidden;}
  body{font-family:var(--active-font-family);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--active-font-family);cursor:pointer;}
  img{max-width:100%;display:block;}
  ::selection{background:#111;color:#fff;}

  .shell{max-width:calc(1120px + var(--fx) * 0.777778);margin:0 auto;padding:0 var(--page-padding);}

  
  header.site-head{
    border-bottom:1px solid var(--line);
    padding:calc(26px + var(--fx) * 0.013542) 0;
    position:fixed; top:0; left:0; right:0; width:100%; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); z-index:50;
  }
  body{padding-top:var(--header-height,90px);}
  .head-grid{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;}
  .head-spacer{grid-column:1;}
  .head-center{grid-column:2; justify-self:center; display:flex; align-items:center; gap:8px;}
  .site-name{
    font-size:calc(19px + var(--fx) * 0.007257); font-weight:700; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;
    font-style:var(--ui-font-style);
  }
  .site-name-edit{
    background:none;border:1px solid var(--line-strong); border-radius:4px; width:22px;height:22px;
    font-size:calc(11px + var(--fx) * 0.004201); color:var(--ink-soft); display:none; align-items:center; justify-content:center; margin-left:8px;
  }
  .master-on .style-clickable{cursor:pointer; transition:outline-color .15s;}
  .master-on .style-clickable:hover{outline:1px dashed var(--line-strong); outline-offset:6px;}
  .master-on .site-name-edit{display:inline-flex;}
  nav.site-nav{
    grid-column:3; justify-self:end;
    display:flex; gap:calc(26px + var(--fx) * 0.013542);
  }
  nav.site-nav a{
    font-size:calc(12px + var(--fx) * 0.004583); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);
    padding-bottom:3px; border-bottom:1px solid transparent; font-style:var(--ui-font-style);
  }
  nav.site-nav a:hover{color:var(--ink);}
  nav.site-nav a.active{color:var(--ink); border-bottom-color:var(--ink);}
  
  nav.site-nav a[data-page="works"]{position:relative;}
  .wl-link{display:none; position:absolute; left:50%; top:100%; transform:translateX(-50%); padding-top:6px; white-space:nowrap;
    font-size:10px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase; cursor:pointer;}
  .wl-link .wl-a:hover{color:var(--ink); text-decoration:underline;}
  .wl-link .wl-sep{margin:0 7px; opacity:.6;}
  body.master-on nav.site-nav a[data-page="works"]:hover .wl-link{display:block;}
  
  .lang-switch{display:inline-flex; align-items:center; gap:5px; padding-left:calc(18px + var(--fx) * 0.009375); margin-left:-8px; border-left:1px solid var(--line-strong); align-self:center; line-height:1;}
  .lang-switch button{all:unset; cursor:pointer; font-size:calc(10.5px + var(--fx) * 0.004010); letter-spacing:.12em; color:var(--ink-faint, #aaa); font-style:var(--ui-font-style); padding:2px 0;}
  .lang-switch button:hover{color:var(--ink);}
  .lang-switch i{font-style:normal; font-size:calc(10px + var(--fx) * 0.003819); color:var(--line-strong);}
  html:not([data-lang="en"]) .lang-switch [data-setlang="ko"], html[data-lang="en"] .lang-switch [data-setlang="en"]{color:var(--ink); font-weight:600;}
  
  html[data-lang="en"] .l-ko{display:none;}
  html[data-lang="en"] .only-ko, html:not([data-lang="en"]) .only-en{display:none !important;}
  html:not([data-lang="en"]) .l-en{display:none;}

  @media (max-width:640px){
    
    .detail-desc, .cv-statement, .static-page .detail-desc{text-align:justify !important;}
    .cv-text{text-align:left !important;} 
    .head-grid{grid-template-columns:1fr; text-align:center; gap:14px;}
    .head-spacer{display:none;}
    .head-center{grid-column:1; justify-self:center;}
    nav.site-nav{grid-column:1; justify-self:center; gap:16px; flex-wrap:wrap; justify-content:center;}
    .lang-switch{position:absolute; top:12px; right:16px; padding:0; margin:0; border-left:0;}
  }
  
  @media (pointer:coarse){
    input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]), select, textarea{font-size:16px !important;}
    
    nav.site-nav a{position:relative;}
    nav.site-nav a::after{content:""; position:absolute; left:-7px; right:-7px; top:-12px; bottom:-10px;}
    .lang-switch button{position:relative;}
    .lang-switch button::after{content:""; position:absolute; left:-8px; right:-8px; top:-12px; bottom:-12px;}
  }

  
  main{padding:calc(64px + var(--fx) * 0.033333) 0 calc(120px + var(--fx) * 0.062500);}
  
  body{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;}
  body > main{flex:1 0 auto; display:flex; flex-direction:column; width:100%;}
  body > footer{flex-shrink:0;}
  #app{flex:1 0 auto; min-width:0;}
  body > main{min-width:0;}
  
  #app.center-page{display:flex; flex-direction:column; justify-content:center; padding-bottom:56px;}
  #app.center-page > .contact-wrap{padding-top:0;}
  .page-title{font-size:calc(13px + var(--fx) * 0.004965); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:36px;}

  
  .cv-wrap{max-width:var(--content-max-width); position:relative; margin-left:auto; margin-right:auto;}
  .cv-text{font-size:var(--content-font-size); letter-spacing:var(--content-letter-spacing); font-weight:var(--content-font-weight); text-align:var(--content-text-align); color:var(--ink); white-space:pre-wrap; line-height:1.9;}
  .cv-style-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-top:10px; font-size:calc(12px + var(--fx) * 0.004583); color:var(--ink-soft);}
  .cv-style-row .grp{display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .cv-style-row span, .cv-style-row button, .cv-style-row b{white-space:nowrap;}
  .cv-style-row input[type=number]{width:62px; font:inherit; font-size:calc(12px + var(--fx) * 0.004583); padding:4px 6px; border:1px solid var(--line-strong); border-radius:5px;}
  .cv-style-row input[type=range]{width:120px; accent-color:#111;}
  .cv-style-row b{min-width:40px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums;}
  .cv-style-row button{font:inherit; font-size:calc(11.5px + var(--fx) * 0.004392); padding:5px 9px; border:1px solid var(--line-strong); border-radius:5px; background:#fff; cursor:pointer; color:var(--ink);}
  .cv-style-row button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .cv-name{font-size:var(--content-font-size); letter-spacing:var(--content-letter-spacing); color:var(--ink); line-height:1.9; margin:0 0 1.6rem;}
  .cv-statement{font-size:calc(var(--content-font-size) * 1.12); letter-spacing:var(--content-letter-spacing); color:var(--ink); line-height:2.05; max-width:var(--content-max-width); white-space:pre-wrap; word-break:keep-all; margin:0 0 3.2rem;}
  .cv-statement .l-ko,.cv-statement .l-en{white-space:pre-wrap;}
  .edit-fab{
    display:none; align-items:center; gap:6px; background:var(--ink); color:#fff; border:none;
    font-size:calc(11px + var(--fx) * 0.004201); letter-spacing:.08em; text-transform:uppercase; padding:9px 14px; border-radius:100px;
    margin-bottom:24px; font-style:var(--ui-font-style);
  }
  .master-on .edit-fab{display:inline-flex;}
  .edit-fab:hover{background:#000;}

  .grid-bleed{
    width:var(--vwpx, 100vw); position:relative; left:50%;
    margin-left:calc(var(--vwpx, 100vw) / -2);
  }
  
  .col-grid{
    display:grid; grid-template-columns:repeat(var(--frame-cols),1fr); gap:var(--frame-gap);
  }
  @media (max-width:640px){ .col-grid{grid-template-columns:1fr;} }
  
  @media (min-width:641px){
    html[data-frame-cols="2"] .col-grid > .frame[data-id]:nth-child(2n+1):nth-last-child(2){grid-column:1 / -1; aspect-ratio:3/1;}
    html[data-frame-cols="3"] .col-grid > .frame[data-id]:nth-child(3n+1):nth-last-child(2){grid-column:1 / -1; aspect-ratio:9/2;}
    html[data-frame-cols="4"] .col-grid > .frame[data-id]:nth-child(4n+1):nth-last-child(2){grid-column:1 / -1; aspect-ratio:6/1;}
    html[data-frame-cols="5"] .col-grid > .frame[data-id]:nth-child(5n+1):nth-last-child(2){grid-column:1 / -1; aspect-ratio:15/2;}
  }

  .frame{
    position:relative; aspect-ratio:3/2; background:#fafafa; border:1px solid var(--line);
    overflow:hidden; cursor:pointer;
  }
  .frame img{width:100%;height:100%;object-fit:cover;}
  .frame .placeholder-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:calc(11px + var(--fx) * 0.004201); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);
  }
  .frame .hover-title{
    position:absolute; inset:0; background:rgba(255,255,255,.44);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:16px;
    opacity:0; transition:opacity .25s ease;
  }
  .frame:hover .hover-title{opacity:1;}
  .frame.empty .hover-title{display:none;}
  .hover-title span{font-size:var(--frame-title-size); letter-spacing:.04em; font-weight:600; text-shadow:0 1px 4px rgba(255,255,255,.85), 0 0 12px rgba(255,255,255,.6);}

  
  .shop-wrap{max-width:calc(1480px + var(--fx) * 1.027778); margin:0 auto; padding:0 clamp(16px,3vw,40px);}
  .shop-tabs{display:flex; justify-content:center; gap:clamp(22px,4vw,48px); margin:22px 0 44px; flex-wrap:wrap;}
  .shop-tabs a{font-size:calc(12px + var(--fx) * 0.004583); letter-spacing:.24em; color:var(--ink-faint); padding:4px 0 7px; border-bottom:1px solid transparent; transition:color .18s ease, border-color .18s ease;}
  .shop-tabs a:hover{color:var(--ink);}
  .shop-tabs a.active{color:var(--ink); border-bottom-color:var(--ink);}
  @media (max-width:480px){ .shop-tabs{gap:13px;} .shop-tabs a{letter-spacing:.1em;} }  
  .shop-tab-empty{min-height:34vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;}
  .shop-tab-empty .t{font-size:calc(12px + var(--fx) * 0.004583); letter-spacing:.3em; text-transform:uppercase; color:var(--ink);}
  .shop-tab-empty .s{font-size:calc(12px + var(--fx) * 0.004583); letter-spacing:.06em; color:var(--ink-faint);}
  
  
  .shop-grid{--cols-now:var(--shop-cols,5); --gx:clamp(14px,1.6vw,26px);
    --sgw:calc(var(--vwpx, 100vw) - 2 * var(--shop-side, 32px));
    width:var(--sgw); max-width:none; margin-left:calc(50% - var(--sgw) / 2);
    display:flex; flex-wrap:wrap; justify-content:center; gap:44px var(--gx); font-family:var(--shop-font,inherit);}
  .shop-grid > .shop-card{flex:0 0 calc((100% - (var(--cols-now) - 1) * var(--gx)) / var(--cols-now)); min-width:0;}
  
  .shop-grid{flex-direction:column; flex-wrap:nowrap;}
  .shop-row{--cols-now:var(--n,5); display:flex; flex-wrap:wrap; justify-content:center; gap:44px var(--gx); width:100%;}
  .shop-row > .shop-card{flex:0 0 calc((100% - (var(--cols-now) - 1) * var(--gx)) / var(--cols-now)); min-width:0;}
  @media (max-width:900px){ .shop-row{--cols-now:var(--n-sm,3);} }
  @media (max-width:600px){ .shop-row{--cols-now:var(--n-xs,2); gap:30px 12px;} }
  @media (max-width:1180px){ .shop-grid{--cols-now:var(--shop-cols-md,5);} }
  @media (max-width:900px){ .shop-grid{--cols-now:var(--shop-cols-sm,3);} }
  @media (max-width:600px){ .shop-grid{--cols-now:var(--shop-cols-xs,2); --gx:12px; row-gap:30px; --sgw:calc(var(--vwpx, 100vw) - 2 * min(var(--shop-side, 32px), 24px));} }
  .shop-card{position:relative; display:block; color:inherit;}
  .vis-seg{display:flex; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden;}
  .vis-seg button{flex:1; font:inherit; font-size:calc(12.5px + var(--fx) * 0.004774); padding:9px 10px; border:0; background:#fff; color:var(--ink-faint); cursor:pointer;}
  .vis-seg button + button{border-left:1px solid var(--line-strong);}
  .vis-seg button.on[data-v="public"]{background:#1d6b3a; color:#fff;}
  .vis-seg button.on[data-v="hidden"]{background:#555; color:#fff;}
  .vis-note{font-size:calc(11.5px + var(--fx) * 0.004392); color:var(--ink-faint); margin-top:6px;}
  .shop-card.is-hidden .shop-thumb, .shop-card.is-hidden .shop-info{opacity:.38;}   .frame.is-hidden > img{opacity:.38;}
  .shop-hidden-badge{position:absolute; top:8px; left:8px; z-index:5; font-size:calc(10.5px + var(--fx) * 0.004010); letter-spacing:.06em; padding:3px 7px; border-radius:3px; background:#555; color:#fff;}
  .pd-hidden-note{margin:0 0 18px; padding:10px 14px; background:#f3f3f3; border-left:3px solid #555; font-size:calc(12.5px + var(--fx) * 0.004774); color:#444;}
  
  body.master-on .shop-grid > .shop-card[data-id]{cursor:grab; -webkit-user-drag:none; user-select:none; -webkit-touch-callout:none;}
  body.master-on .shop-grid > .shop-card[data-id] img{-webkit-user-drag:none; pointer-events:none;}
  body.master-on .col-grid > .frame[data-id]{cursor:grab; -webkit-user-drag:none; user-select:none; -webkit-touch-callout:none;}
  body.master-on .col-grid > .frame[data-id] img{-webkit-user-drag:none; pointer-events:none;}
  .frame.dragging{opacity:.35;}
  .shop-card.dragging{opacity:.35;}
  .shop-drag-ghost{position:fixed; z-index:400; pointer-events:none; opacity:.92; box-shadow:0 14px 34px rgba(0,0,0,.22); transform:rotate(1.2deg); background:#fff; cursor:grabbing;}
  body.shop-dragging, body.shop-dragging *{cursor:grabbing !important; user-select:none !important;}
  .shop-reorder-hint{text-align:center; font-size:calc(11.5px + var(--fx) * 0.004392); color:var(--ink-faint); margin:-22px 0 22px; letter-spacing:.02em;}
  .shop-coming-soon{min-height:50vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;}
  .shop-coming-title{font-size:calc(13px + var(--fx) * 0.004965); letter-spacing:.3em; color:var(--ink);}
  .shop-coming-sub{font-size:calc(13px + var(--fx) * 0.004965); letter-spacing:.06em; color:var(--ink-faint);}
  .shop-release-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:12px 16px; margin-bottom:28px; border:1px dashed #d08a2e; background:#fff8ec; color:#8a5a14; font-size:calc(12.5px + var(--fx) * 0.004774); border-radius:6px;}
  .shop-release-bar.is-public{border-color:#5a9a5a; background:#f1f8f0; color:#2f6a2f;}
  .shop-release-bar button{font:inherit; font-size:calc(12px + var(--fx) * 0.004583); padding:7px 14px; border-radius:5px; border:1px solid currentColor; background:#fff; color:inherit; cursor:pointer; white-space:nowrap;}
  .shop-release-bar:not(.is-public) button:last-child{background:#111; color:#fff; border-color:#111;}
  .shop-thumb{
    position:relative; background:#f3f3f1; overflow:hidden; aspect-ratio:4/5;
  }
  .shop-thumb img{position:absolute; inset:9%; width:82%; height:82%; object-fit:contain; display:block;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.08)); transition:transform .35s ease;}
  .shop-card:hover .shop-thumb img{transform:scale(1.025);}
  .master-only-tile .shop-thumb{background:#fff; border:1.5px dashed var(--line-strong);}
  .shop-thumb .placeholder-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:calc(11px + var(--fx) * 0.004201); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);
  }
  .shop-sold-badge{
    position:absolute; left:0; bottom:0; padding:5px 10px; background:var(--ink); color:#fff;
    font-size:calc(10px + var(--fx) * 0.003819); letter-spacing:.14em;
  }
  .shop-info{padding:12px 1px 0; text-align:center;}
  .shop-name{font-size:var(--shop-grid-title,13px); letter-spacing:.01em; line-height:1.45;}
  .shop-spec{font-size:var(--caption-font-size); color:var(--ink-soft); line-height:1.5; margin-top:4px;}
  .shop-edition{font-size:var(--caption-font-size); color:var(--ink-faint); margin-top:2px; font-family:var(--mono);}
  .shop-price{font-size:var(--shop-grid-price,12px); margin-top:6px; letter-spacing:.03em; color:var(--ink);}
  
  .pd{max-width:calc(1320px + var(--fx) * 0.916667); margin:10px auto 0; padding:0 clamp(16px,3vw,40px); display:grid;
    grid-template-columns:minmax(0, var(--shop-main-pct,56%)) minmax(0, 1fr); gap:clamp(24px,4vw,64px); align-items:start; font-family:var(--shop-font,inherit);}
  .pd-media{position:sticky; top:calc(var(--header-height, 90px) + 16px);}
  .pd-main{position:relative; aspect-ratio:4/5; background:#f3f3f1; overflow:hidden; cursor:zoom-in;}
  .pd-main img{position:absolute; inset:6%; width:88%; height:88%; object-fit:contain; filter:drop-shadow(0 1px 3px rgba(0,0,0,.08));}
  .pd-main .placeholder-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:calc(12px + var(--fx) * 0.004583); color:var(--ink-faint);}
  .pd-thumbs{display:grid; grid-template-columns:repeat(var(--shop-thumb-cols,5), minmax(0,1fr)); gap:var(--shop-thumb-gap,8px); margin-top:var(--shop-thumb-gap,8px);}
  .pd-thumb{width:100%; aspect-ratio:4/5; padding:0; border:1px solid transparent; background:#f3f3f1; cursor:pointer; position:relative; overflow:hidden; opacity:.7; transition:opacity .15s ease, border-color .15s ease;}
  .pd-thumb img{position:absolute; inset:8%; width:84%; height:84%; object-fit:contain;}
  .pd-thumb:hover{opacity:1;}
  .pd-thumb.on{opacity:1; border-color:var(--ink);}
  .pd-info{padding-top:4px; min-width:0;}
  .pd-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .pd-title{font-size:var(--shop-title,26px); line-height:1.25; font-weight:600; letter-spacing:.005em; margin:0; overflow-wrap:break-word;}
  .book-meta{margin-top:10px; font-size:calc(var(--shop-body,14px) - 1px); color:var(--ink-soft); line-height:1.6;}
  .book-meta .bm{white-space:nowrap;} .book-meta .bm-sep{color:var(--line2,#bbb);}
  .book-secs{max-width:calc(1320px + var(--fx) * 0.916667); margin:calc(64px + var(--fx) * 0.033333) auto 0; padding:0 clamp(16px,3vw,40px); font-family:var(--shop-font,inherit);}
  .book-sec{border-top:1px solid var(--ink); padding:22px 0 40px;}
  .book-h{font-size:calc(13px + var(--fx) * 0.004965); font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin:0 0 18px; color:var(--ink);}
  html[data-lang="ko"] .book-h{letter-spacing:.04em; font-size:calc(15px + var(--fx) * 0.005729);}
  .book-desc{font-size:var(--shop-body,14px); line-height:1.85; color:var(--ink); white-space:pre-line; max-width:calc(820px + var(--fx) * 0.313194);}
  .book-toc{font-size:var(--shop-body,14px); line-height:1.9; color:var(--ink); white-space:pre-line; max-width:calc(820px + var(--fx) * 0.313194);}
  .book-toc.clamp{max-height:calc(1.9em * 14); overflow:hidden; position:relative;}
  .book-toc.clamp::after{content:""; position:absolute; left:0; right:0; bottom:0; height:60px; background:linear-gradient(rgba(255,255,255,0), var(--bg,#fff));}
  .book-more{margin-top:12px; background:none; border:1px solid var(--line); padding:8px 16px; font:inherit; font-size:calc(12px + var(--fx) * 0.004583); letter-spacing:.06em; cursor:pointer; color:var(--ink);}
  .book-more .m2{display:none;} .book-more.open .m1{display:none;} .book-more.open .m2{display:inline;}
  .book-info{border-collapse:collapse; width:100%; max-width:calc(820px + var(--fx) * 0.313194); font-size:var(--shop-body,14px);}
  .book-info th, .book-info td{border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:11px 14px; text-align:left; vertical-align:top; line-height:1.6;}
  .book-info th{width:150px; background:#f6f6f4; font-weight:500; color:var(--ink-soft); white-space:nowrap;}
  .book-info td{font-variant-numeric:tabular-nums;}
  @media (max-width:640px){ .book-info th{width:96px; padding:10px;} .book-info td{padding:10px;} .book-secs{margin-top:44px;} }
  .shop-author{font-size:calc(var(--shop-grid-title,13px) - 1px); color:var(--ink-soft); margin-top:3px;}
  .bookinfo-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px;}
  .bi-lab{display:block; font-size:calc(11px + var(--fx) * 0.004201); color:#888; margin:0 0 3px;}
  #bookInfoField textarea{width:100%;}
