.stage canvas{display:block;width:100%;height:100%}

const gl=new GLTFLoader(); gl.setMeshoptDecoder(MeshoptDecoder);
async function getClip(id){

  if(id.startsWith('view-')) return clipCache[id]=viewPose(id);
  const j=await (await fetch('models/fig/a_'+id+'.json')).json(); const g=await new Promise((res,rej)=>gl.parse(ab(j.b64),'',res,rej));
  return clipCache[id]=bakeOnto(g.scene,g.animations[0]);}
async function setClip(kind){
  if(!mix) return; let c; try{c=await getClip(P[kind]);}catch(e){console.error(e); return;}
  const old=kind==='walk'?aw:ai, a=mix.clipAction(c); if(old===a) return;
  a.reset().play(); a.weight=old?old.weight:(kind==='walk'?1:0); if(old) old.stop();

const ab=b64=>{const t=atob(b64), u=new Uint8Array(t.length); for(let i=0;i<t.length;i++) u[i]=t.charCodeAt(i); return u.buffer;};
function rebuild(cell=0.011){
  if(!rig) return;

  const saveQ=new Map(); for(const b of restQ.keys()){saveQ.set(b,b.quaternion.clone()); b.quaternion.copy(restQ.get(b));}
  const hp=B.Hips.position.clone(); B.Hips.position.copy(restPos.get(B.Hips)).multiplyScalar(ratio);
  holder.scale.setScalar(1); holder.position.set(0,0,0); holder.updateMatrixWorld(true);
  const W=n=>{if(n==='@pelvis') return B.LeftUpLeg.getWorldPosition(new THREE.Vector3()).add(B.RightUpLeg.getWorldPosition(new THREE.Vector3())).multiplyScalar(0.5).add(new THREE.Vector3(0,-0.035,0));
    if(n==='@neckBase') return B.Neck.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0,-0.02,-0.005));
    if(n==='@neckTop') return B.Head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0,0.035,0.012));
    if(n.startsWith('@trap')){const s=n.slice(5); return B[s+'Shoulder'].getWorldPosition(new THREE.Vector3()).lerp(B[s+'Arm'].getWorldPosition(new THREE.Vector3()),0.55).add(new THREE.Vector3(0,0.025,-0.01));}
    if(n.startsWith('@heel')){const s=n.slice(5), f=B[s+'Foot'].getWorldPosition(new THREE.Vector3()), t=B[s+'ToeBase'].getWorldPosition(new THREE.Vector3()); return f.clone().addScaledVector(t.sub(f),-0.28).add(new THREE.Vector3(0,-0.035*P.foot,0));}

  const CH={body:[cell,P.soft],head:[0.0042*q,Math.min(P.soft,0.028)],handLeft:[0.0034*q,0.004],handRight:[0.0034*q,0.004],footLeft:[0.0055*q,Math.min(P.soft,0.02)],footRight:[0.0055*q,Math.min(P.soft,0.02)]};

    for(const [mat,ro] of [[baseDepth,1],[baseMat,2]]){const m=new THREE.SkinnedMesh(g,mat); m.renderOrder=ro; m.frustumCulled=false; m.castShadow=mat===baseDepth; m.layers.set(FIGL); if(mat===baseDepth) m.layers.enable(0); holder.add(m); m.updateMatrixWorld(true); m.bind(skel,m.matrixWorld); skins.push(m);}

    for(const [mat,ro] of [[baseDepth,1],[baseMat,2]]){const m=new THREE.Mesh(FCH.g,mat); m.renderOrder=ro; m.castShadow=mat===baseDepth; m.frustumCulled=false; m.layers.set(FIGL); if(mat===baseDepth) m.layers.enable(0);
      m.scale.set(k,kh,k); m.position.set(hb.x,topY-FCH.top*kh,hb.z+0.01*P.head); holder.add(m); m.updateMatrixWorld(true); B.Head.attach(m); headMs.push(m);}

function apply(){
  baseMat.color.setRGB(P.tone,P.tone,P.tone*1.03,THREE.SRGBColorSpace); baseMat.opacity=1-P.op; baseMat.transparent=true; uEdge.value=0;
  if(aw) aw.timeScale=P.speed; showCode();
  const sk=JSON.stringify(Object.entries(P).filter(([k])=>!['tone','op','speed','walk','idle','upright','chin','kneeUp','edge','blur','armSwing','elbowBend','shrug','tall'].includes(k)));
  if(sk!==shapeKey&&rig){shapeKey=sk; document.getElementById('busy').hidden=false; clearTimeout(timer); clearTimeout(timer2); // quick rough skin while dragging, the fine one once you stop
    timer=setTimeout(()=>{rebuild(0.017); document.getElementById('busy').hidden=false;},90); timer2=setTimeout(()=>rebuild(0.011),650);}}

// ---------- load the mannequin (skeleton + walk/idle)
(async()=>{
  const j=await (await fetch('models/xbot.json')).json(); const bin=Uint8Array.from(atob(j.b64),c=>c.charCodeAt(0));
  const g=await new Promise((res,rej)=>new GLTFLoader().parse(bin.buffer,'',res,rej));
  const o=g.scene; holder=new THREE.Group(); holder.add(o); scene.add(holder);
  setup(o);
  {const hj=await (await fetch('models/fig/fc_head.json')).json(); const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(ab(hj.pos)),3)); g.setIndex(new THREE.BufferAttribute(new Uint16Array(ab(hj.idx)),1)); g.computeVertexNormals(); FCH={g,top:hj.top,chin:hj.chin};}
  const clips=Object.fromEntries(g.animations.map(a=>[a.name,a]));
  for(const c of [clips.walk,clips.idle]){ // keep bone rotations; only the hips move, so new bone lengths hold
    c.tracks=c.tracks.filter(t=>!t.name.endsWith('.position')||/Hips\.position$/.test(t.name)).filter(t=>!t.name.endsWith('.scale'));
    for(const t of c.tracks) if(t.name.endsWith('.position')){t.orig=Float32Array.from(t.values); hipTracks.push(t);}}
  xbotClips={walk:clips.walk,idle:clips.idle};
  mix=new THREE.AnimationMixer(o); aw=mix.clipAction(clips.walk); ai=mix.clipAction(clips.idle); aw.play(); ai.play(); ai.weight=0;
  document.getElementById('loading').remove(); apply(); await setClip('walk'); await setClip('idle'); loadCalm();
})().catch(e=>{document.getElementById('loading').textContent='불러오기 실패: '+e.message; console.error(e);});

// ---------- view buttons
let state='walk'; const bW=document.getElementById('bWalk'), bI=document.getElementById('bIdle');
bW.onclick=()=>{state='walk'; bW.setAttribute('aria-pressed','true'); bI.setAttribute('aria-pressed','false');};
bI.onclick=()=>{state='idle'; bI.setAttribute('aria-pressed','true'); bW.setAttribute('aria-pressed','false');};
const VIEWS={front:[0,1.2,5.2],side:[5.2,1.2,0],back:[0,1.2,-5.2],q:[3.4,1.6,4.0]}; let goal=null;
document.querySelectorAll('.hud [data-v]').forEach(b=>b.onclick=()=>{goal=new THREE.Vector3(...VIEWS[b.dataset.v]);});
ctl.addEventListener('start',()=>goal=null);
// posture: straighten the back on top of the motion (spine leans back a little, neck up, head level)
const POST=[['Spine',5],['Spine1',5],['Spine2',5],['Neck',4]], _pq=new THREE.Quaternion(), _px=new THREE.Vector3(1,0,0);
function posture(){ if(!B.Spine) return; const k=(P.upright??1)*(aw?aw.weight:1), sgn=POSTSIGN;
  const tl=(P.tall??0)*(aw?aw.weight:1), kn=Math.min(1,(P.kneeUp??0)*(aw?aw.weight:1)+tl*0.5); if(kn>0) for(const n of ['LeftLeg','RightLeg']) B[n].quaternion.slerp(restQ.get(B[n]),kn);
  if(tl>0&&B.Hips) B.Hips.position.y+=tl*3.5*curRatio; // straighter legs reach further: lift the body so the feet stay on the floor
  let tot=0; for(const [n,deg] of POST){const a=sgn*k*deg*Math.PI/180; tot+=a; B[n].quaternion.multiply(_pq.setFromAxisAngle(_px,a));}
  B.Head.quaternion.multiply(_pq.setFromAxisAngle(_px,-tot*0.85+sgn*(P.chin??0.5)*6*Math.PI/180));
  armCalm();}
// calmer arms while walking: the swing is pulled toward a relaxed hang (the 'view-calm' arms) — smaller swing, straighter elbows, looser shoulders
let CALM=null;
async function loadCalm(){ try{ const c=await getClip('view-calm'); CALM={}; for(const t of c.tracks){ const m=/^(.*)\.quaternion$/.exec(t.name); if(m) CALM[m[1]]=new THREE.Quaternion().fromArray(t.values,0); } }catch(e){ console.warn('calm',e); } }

  for(const s of ['Left','Right']){
    const pull=(b,amt)=>{ if(!b||amt<=0) return; const q=CALM[b.name]; if(q) b.quaternion.slerp(q,Math.min(1,amt)); };
    pull(B[s+'Arm'],(1-(P.armSwing??1))*w); pull(B[s+'ForeArm'],(1-(P.elbowBend??1))*w); pull(B[s+'Hand'],(1-(P.armSwing??1))*w*0.6); pull(B[s+'Shoulder'],(P.shrug??0)*w); } }
window.__exp=()=>{const col=skins.filter(m=>m.material===baseMat).map(m=>({pos:Array.from(m.geometry.attributes.position.array),idx:Array.from(m.geometry.index.array),si:Array.from(m.geometry.attributes.skinIndex.array),sw:Array.from(m.geometry.attributes.skinWeight.array),bones:m.skeleton.bones.map(b=>b.name)})); const hm=headMs.find(m=>m.material===baseMat); const bp={}; rig.traverse(o=>{if(o.isBone) bp[o.name]=o.position.toArray();}); const cj=c=>THREE.AnimationClip.toJSON(c); return {chunks:col, head:hm?{pos:Array.from(FCH.g.attributes.position.array),idx:Array.from(FCH.g.index.array),bone:hm.parent.name,p:hm.position.toArray(),q:hm.quaternion.toArray(),s:hm.scale.toArray()}:null, bonePos:bp, scale:holder.scale.x, y:holder.position.y, ratio:curRatio, walk:cj(aw.getClip()), idle:cj(ai.getClip()), P}}; const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(0.05,clock.getDelta());
  if(mix){const w=state==='walk'?1:0; aw.weight+=(w-aw.weight)*Math.min(1,dt*5); ai.weight=1-aw.weight; mix.update(dt); posture();}
  if(goal){cam.position.lerp(goal,Math.min(1,dt*4)); if(cam.position.distanceTo(goal)<0.01) goal=null;}

// ---------- outline blur: the figure is drawn alone, blurred (gaussian, two passes) and laid over the room
const blurRT=[0,1,2].map(()=>new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,depthBuffer:true}));
const qCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1), qScene=new THREE.Scene(), quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2)); qScene.add(quad);
const blurMat=new THREE.ShaderMaterial({uniforms:{t:{value:null},dir:{value:new THREE.Vector2()}},depthTest:false,depthWrite:false,
  vertexShader:'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`uniform sampler2D t; uniform vec2 dir; varying vec2 vUv;

  fragmentShader:`uniform sampler2D t; varying vec2 vUv;

function drawFrame(){
