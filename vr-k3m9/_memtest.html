<body><canvas id="c"></canvas>

import * as THREE from './three/three.module.min.js';

const cam=new THREE.PerspectiveCamera(60,1,0.1,200); cam.position.set(0,1.5,0.5); cam.lookAt(0,1.5,-10);
const rts=[0,1].map(()=>new THREE.WebGLRenderTarget(2,2,{samples:4,type:THREE.HalfFloatType}));
const draw=()=>{ const W=cv.clientWidth,H=cv.clientHeight; R.setSize(W,H,false); cam.aspect=W/H; cam.updateProjectionMatrix(); const pr=R.getPixelRatio(); for(const rt of rts){ rt.setSize(W*pr,H*pr); R.setRenderTarget(rt); R.render(s,cam);} R.setRenderTarget(null); R.render(s,cam); };
draw(); addEventListener('resize',draw);
</script></body></html>
