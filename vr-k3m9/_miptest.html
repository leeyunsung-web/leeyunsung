<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Mip test</title>
<style>html,body{margin:0;background:#fff;font:14px -apple-system,sans-serif;color:#222}canvas{display:block;width:100vw;height:100vh}
.l{position:fixed;left:8px;font:700 22px -apple-system,sans-serif;color:#d0021b;text-shadow:0 0 4px #fff}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// temporary test page (2026-11-11): which way of preparing the painting pictures stays bright on iPhone when seen far away. Delete after the test.
import * as THREE from './three/three.module.min.js';
const cv=document.getElementById('c'), R=new THREE.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2));
const ANI=Math.min(16,R.capabilities.getMaxAnisotropy()||8), N=5, NAMES=['A','B','C','D','E'];
const img=await new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.src='tex/m/w3-p-1787592502932-69qpr.jpg';});
const pot=()=>{const c=document.createElement('canvas'); c.width=1024; c.height=1024; c.getContext('2d').drawImage(img,0,0,1024,1024); return c;};
const mk=k=>{ // A: as the site now · B: plain sRGB · C: no sRGB on the card, decoded in the shader · D: square 1024 picture · E: no mipmaps
  const t=k===3?new THREE.CanvasTexture(pot()):new THREE.Texture(img); t.needsUpdate=true; t.anisotropy=ANI;
  t.colorSpace=k===2?THREE.NoColorSpace:THREE.SRGBColorSpace; if(k===4){t.generateMipmaps=false; t.minFilter=THREE.LinearFilter;}
  const m=new THREE.MeshBasicMaterial({map:t});
  if(k===0) m.onBeforeCompile=sh=>{ sh.fragmentShader=sh.fragmentShader.replace('#include <map_fragment>',`vec2 ddx=dFdx(vMapUv)*0.8, ddy=dFdy(vMapUv)*0.8; float b=-0.5;
    vec4 s=0.25*(texture2D(map,vMapUv+ddx*0.125+ddy*0.375,b)+texture2D(map,vMapUv-ddx*0.375+ddy*0.125,b)+texture2D(map,vMapUv+ddx*0.375-ddy*0.125,b)+texture2D(map,vMapUv-ddx*0.125-ddy*0.375,b)); diffuseColor*=s;`); };
  if(k===2) m.onBeforeCompile=sh=>{ sh.fragmentShader=sh.fragmentShader.replace('#include <map_fragment>',`vec4 s=texture2D(map,vMapUv); s.rgb=mix(s.rgb*0.0773993808,pow(s.rgb*0.9478672986+vec3(0.0521327014),vec3(2.4)),vec3(greaterThan(s.rgb,vec3(0.04045)))); diffuseColor*=s;`); };
  return m; };
const scenes=[...Array(N)].map((_,k)=>{ const s=new THREE.Scene(); s.background=new THREE.Color(0xf2f2f2); const m=mk(k);
  for(let i=0;i<9;i++){ const p=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.62),m); p.position.set(-1.6,1.5,-2-i*2.2); p.rotation.y=Math.PI/2; s.add(p); }
  for(let i=0;i<6;i++){ const p=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.62),m); p.position.set(-3+i*1.5,1.5,-26-i*6); s.add(p); }
  return s; });
const cam=new THREE.PerspectiveCamera(60,1,0.1,200); cam.position.set(0.6,1.5,0); cam.lookAt(-1.2,1.5,-8);
const labels=NAMES.map(n=>{const d=document.createElement('div'); d.className='l'; d.textContent=n; document.body.appendChild(d); return d;});
const draw=()=>{ const W=cv.clientWidth,H=cv.clientHeight; R.setSize(W,H,false); const h=H/N; cam.aspect=W/h; cam.updateProjectionMatrix(); R.setScissorTest(true);
  for(let k=0;k<N;k++){ const y=H-(k+1)*h; R.setViewport(0,y,W,h); R.setScissor(0,y,W,h); R.render(scenes[k],cam); labels[k].style.top=(k*h+6)+'px'; } };
draw(); addEventListener('resize',draw); setTimeout(draw,500);
</script></body></html>
