<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>View on your wall — Lee Yunsung</title>
<style>
:root{--ink:#1d1c1a;--soft:#6f6b65;--line:#e4e1db;--bg:#f6f5f2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
header{padding:28px 20px 10px;max-width:1100px;margin:0 auto}
h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:clamp(24px,4vw,34px);margin:0}
.sub{color:var(--soft);font-size:13px;margin-top:6px;line-height:1.5}
.tabs{display:flex;gap:8px;margin:18px 0 0}
.tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:14px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.tile{all:unset;cursor:pointer;display:block}
.tile .im{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--line)}
.tile img{max-width:100%;max-height:100%;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tile b{display:block;font-weight:500;font-size:13px;margin-top:8px;line-height:1.35}
.tile span{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.tile .hid{color:#b04a2f}
#view{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
#view.on{display:flex}
#view .top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}
#back{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:2px 8px}
#vt b{display:block;font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:18px}
#vt span{display:block;color:var(--soft);font-size:12px;margin-top:2px}
model-viewer{flex:1;width:100%;background:linear-gradient(#efeeea,#e3e1dc);--poster-color:transparent}
#arBtn{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border:0;border-radius:999px;padding:15px 26px;font-size:15px;letter-spacing:.02em;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
#arBtn small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.note{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;text-align:center;line-height:1.5;max-width:88%}
#shopLink{margin-left:auto;font-size:12px;color:var(--ink);letter-spacing:.04em;text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
#tune{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;max-height:56%;overflow:auto;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;font-size:13px;z-index:3}
#tune.min{right:auto;max-height:none;overflow:visible;padding:6px 10px}#tune.min .grid,#tune.min .btns,#tune.min h3 small{display:none}#tune.min h3{margin:0}
#tTog{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
#tune h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#tune h3 small{font-weight:400;color:var(--soft)}
#tune .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 22px}
#tune label{display:grid;grid-template-columns:7.5em 1fr 3.2em;align-items:center;gap:8px;color:var(--ink)}
#tune input[type=range]{width:100%}
#tune output{font-variant-numeric:tabular-nums;color:var(--soft);text-align:right}
#tune .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
#tune .btns button{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer}
#tune .btns button.pri{background:var(--ink);color:#fff}
#tune .info{color:var(--soft);font-size:12px}
#lock{max-width:520px;margin:80px auto;text-align:center;color:var(--soft);font-size:14px;display:none}
</style>
</head>
<body>
<div id="lock">Coming soon.<br>준비 중입니다.</div>
<header id="hd" hidden>
  <h1>View on your wall</h1>
  <div class="sub">Pick a work, then point your phone at a wall: it appears at its real size.<br>작품을 고른 뒤 휴대폰으로 벽을 비추면 실제 크기로 걸려요.</div>
  <div class="tabs" id="tabs"><button data-k="original" aria-pressed="true">Originals</button><button data-k="edition" aria-pressed="false">Posters</button><button data-k="sculpture" aria-pressed="false">Sculpture</button></div>
</header>
<main id="grid" hidden></main>
<div id="view">
  <div class="top"><button id="back" aria-label="Back">←</button><div id="vt"><b></b><span></span></div><a id="shopLink" href="#" target="_top">Shop →</a></div>
  <model-viewer id="mv" ar ar-modes="webxr scene-viewer quick-look" ar-placement="wall" ar-scale="fixed" camera-controls disable-pan
    environment-image="neutral" exposure="1" shadow-intensity="0" camera-orbit="0deg 90deg auto" min-camera-orbit="-55deg 55deg auto" max-camera-orbit="55deg 125deg auto" interaction-prompt="none">
    <button slot="ar-button" id="arBtn">View on your wall<small>내 벽에 걸어 보기 (AR)</small></button>
  </model-viewer>
  <div class="note" id="noAR" hidden>AR opens on a phone or tablet.<br>휴대폰이나 태블릿에서 이 페이지를 열어 주세요.</div>
  <div class="note" id="inApp" hidden><span id="inAppMsg"></span><br><button id="extBtn" type="button" style="margin-top:8px;border:0;background:#1d1c1a;color:#fff;border-radius:999px;padding:9px 16px;font-size:13px" hidden>Open in browser · 브라우저로 열기</button></div>
  <div id="tune" hidden>
    <h3>조각 이미지 설정 <small>마스터 전용 · AR 화면에서도 조절돼요 · 바꾸는 즉시 이 기기에 저장</small><button id="tTog" type="button">접기</button></h3>
    <div class="grid" id="tuneGrid"></div>
    <div class="btns"><button class="pri" id="tSave" type="button">홈페이지에 저장</button><button id="tReset" type="button">기본값으로 초기화</button><span class="info" id="tInfo"></span></div>
  </div>
  <a id="qlLink" rel="ar" href="#" hidden style="position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);line-height:0"><img alt="View on your wall (AR)" src="ar-button.png" width="260" height="58" style="filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))"></a>
</div>
<script type="module" src="model-viewer.min.js"></script>
<script>
(function(){
  var master=/(?:^|;\s*)lysM=1/.test(document.cookie);   // public since 2026-11-04; hidden works stay master-only
  document.getElementById('hd').hidden=false; document.getElementById('grid').hidden=false;
  var grid=document.getElementById('grid'), view=document.getElementById('view'), mv=document.getElementById('mv'), items=[], kind='original';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function render(){ grid.innerHTML=''; items.filter(function(x){return x.kind===kind;}).forEach(function(x){
      var b=document.createElement('button'); b.className='tile';
      b.innerHTML='<div class="im"><img loading="lazy" alt="" src="'+esc(x.thumb)+'"></div><b>'+esc(x.title)+'</b><span>'+esc(x.size)+(x.hidden?' · <i class="hid">비공개</i>':'')+'</span>';
      b.onclick=function(){ open(x,true); }; grid.appendChild(b); }); }
  function open(x,push){
    view.classList.add('on'); document.querySelector('#vt b').textContent=x.title;
    document.querySelector('#vt span').textContent=[x.year,x.medium,x.size].filter(Boolean).join(', ');
    var sl=document.getElementById('shopLink'); sl.hidden=!x.url; sl.href=x.url||'#';
    mv.setAttribute('ar-placement',x.floor?'floor':'wall'); mv.setAttribute('camera-orbit',x.floor?'0deg 75deg auto':'0deg 90deg auto'); mv.setAttribute('min-camera-orbit',x.floor?'-Infinity 20deg auto':'-55deg 55deg auto'); mv.setAttribute('max-camera-orbit',x.floor?'Infinity 100deg auto':'55deg 125deg auto');
    document.getElementById('arBtn').firstChild.textContent=x.floor?'View in your space':'View on your wall'; document.querySelector('#arBtn small').textContent=x.floor?'내 공간에 놓아 보기 (AR)':'내 벽에 걸어 보기 (AR)';
    mv.setAttribute('environment-image',x.floor?(x.id==='s-1793370000000-mdsv1'?'env_medusa.jpg':'env_torso.jpg'):'neutral');   // sculptures: the gallery room's light, with the gallery's contrast for each material
    mv.setAttribute('shadow-intensity',x.floor?'0.7':'0'); mv.setAttribute('shadow-softness',x.floor?'0.8':'1'); mv.setAttribute('tone-mapping','neutral'); mv.setAttribute('exposure',x.id==='s-1793370000000-mdsv1'?'0.85':'1');
    cur=x; mv.setAttribute('ios-src',x.usdz||''); mv.src=x.glb; siteReady.then(function(){ buildTune(x); }); mv.alt=x.title+' by Lee Yunsung';
    var ql=document.getElementById('qlLink'); ql.href=(x.usdz||'')+'#allowsContentScaling=0';
    if(push) history.pushState({id:x.id},'','?id='+encodeURIComponent(x.id));
    setTimeout(arFallback,1200);
  }
  // AR everywhere: Safari / Chrome / Edge / Firefox on iPhone use the ready-made Quick Look file, Android uses Scene Viewer or WebXR;
  // in-app browsers (KakaoTalk, Instagram, NAVER, LINE, Facebook) cannot open the camera view, so we offer the outside browser
  var UA=navigator.userAgent, IOS=/iPad|iPhone|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), MOBILE=IOS||/Android/i.test(UA);
  var APP=/KAKAOTALK/i.test(UA)?'kakao':/Instagram/i.test(UA)?'instagram':/NAVER\(inapp|NAVER/i.test(UA)?'naver':/\bLine\//i.test(UA)?'line':/FBAN|FBAV|FB_IAB/i.test(UA)?'facebook':'';
  function arFallback(){
    var noAR=document.getElementById('noAR'), inApp=document.getElementById('inApp'), ql=document.getElementById('qlLink'), btn=document.getElementById('arBtn');
    noAR.hidden=true; inApp.hidden=true; ql.hidden=true;
    if(mv.canActivateAR) return;
    if(APP){ var msg={kakao:'KakaoTalk cannot open the camera view.<br>카카오톡 안에서는 AR이 열리지 않아요.',instagram:'Tap ··· (top right) → Open in external browser.<br>오른쪽 위 ··· → 외부 브라우저로 열기를 눌러 주세요.',naver:'Open this page in Safari or Chrome.<br>사파리나 크롬에서 열어 주세요.',line:'LINE cannot open the camera view.<br>LINE 안에서는 AR이 열리지 않아요.',facebook:'Tap ··· → Open in browser.<br>··· → 브라우저로 열기를 눌러 주세요.'}[APP];
      document.getElementById('inAppMsg').innerHTML=msg; var eb=document.getElementById('extBtn'); eb.hidden=!(APP==='kakao'||APP==='line');
      eb.onclick=function(){ var u=location.href; if(APP==='kakao') location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u); else location.href=u+(u.indexOf('?')<0?'?':'&')+'openExternalBrowser=1'; };
      inApp.hidden=false; return; }
    if(IOS){ ql.hidden=false; return; }            // other iPhone browsers: a plain Quick Look link to the same file
    if(!MOBILE) noAR.hidden=false;
  }
  // ---------- sculpture image settings (master): saved per work, kept until reset ----------
  var TDEF={'s-1793281860372-q9sg2':{exposure:1,contrast:1.25,keyAmt:0.28,keyAz:225,keyEl:35,shadow:0.7,soft:0.8,color:0.93,rough:0.92,metal:0},
            's-1793370000000-mdsv1':{exposure:0.85,contrast:2.6,keyAmt:0,keyAz:225,keyEl:35,shadow:0.7,soft:0.8,color:0.82,rough:0.04,metal:1}};
  var TROWS=[['exposure','밝기',0.3,2,0.01],['contrast','대비',0.6,3.5,0.01],['keyAmt','측면 조명 세기',0,1,0.01],['keyAz','측면 조명 방향',0,360,1],['keyEl','측면 조명 높이',0,80,1],
             ['shadow','바닥 그림자',0,1.5,0.01],['soft','그림자 부드러움',0,1,0.01],['color','재질 밝기',0.3,1,0.01],['rough','거칠기',0,1,0.01],['metal','금속감',0,1,0.01]];
  { const tb=document.getElementById('tune'); mv.appendChild(tb); /* inside <model-viewer>: on Android the AR camera view keeps its children on screen, so the sliders work while you look at the sculpture in your room */
    tb.addEventListener('beforexrselect',function(e){ e.preventDefault(); }); /* touching the panel must not move or place the sculpture */
    var tg=document.getElementById('tTog'); try{ if(localStorage.getItem('lys-ar-tune-min')==='1'){ tb.classList.add('min'); tg.textContent='설정 열기'; } }catch(e){}
    tg.onclick=function(){ var m=tb.classList.toggle('min'); tg.textContent=m?'설정 열기':'접기'; try{ localStorage.setItem('lys-ar-tune-min',m?'1':'0'); }catch(e){} }; }
  var LKEY='lys-ar-tune-v1', SITE={}, LOCAL={}, cur=null, envSrc=null, envTimer=0;
  try{ LOCAL=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}; }catch(e){ LOCAL={}; }
  var siteReady=fetch('settings.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():{};}).then(function(j){ SITE=(j&&j.tune)||{}; }).catch(function(){});
  function tuneOf(id){ var d=TDEF[id]; if(!d) return null; return Object.assign({},d,SITE[id]||{},master?(LOCAL[id]||{}):{}); }
  function loadEnv(){ if(envSrc) return Promise.resolve(envSrc); return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){ var c=document.createElement('canvas'); c.width=1024; c.height=512; var x=c.getContext('2d'); x.drawImage(im,0,0,1024,512); envSrc=x.getImageData(0,0,1024,512); res(envSrc); }; im.onerror=rej; im.src='/vr-k3m9/live/env.jpg'; }); }
  // the gallery's look: final = (surface - 0.70) * contrast + 0.70, baked into the room reflection; plus a side light
  function makeEnv(t){ return loadEnv().then(function(src){ var W=src.width,H=src.height,o=new ImageData(W,H),d=src.data,od=o.data,b=t.color,k=t.contrast,az=t.keyAz*Math.PI/180,el=t.keyEl*Math.PI/180;
      for(var y=0;y<H;y++){ var lat=(0.5-y/H)*Math.PI; for(var x=0;x<W;x++){ var i=(y*W+x)*4, lon=x/W*2*Math.PI, m=Math.max(0,Math.cos(lon-az)*Math.cos(lat-el)); m=m*m*m; var g=(1-0.3*t.keyAmt)+t.keyAmt*m;
        for(var c=0;c<3;c++){ var v=d[i+c]/255; v=((v*b-0.70)*k+0.70)/b; v=Math.min(1,Math.max(0,v))*g; od[i+c]=Math.min(255,Math.max(0,v*255)); } od[i+3]=255; } }
      var c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').putImageData(o,0,0); return new Promise(function(r){ c.toBlob(function(bl){ r(URL.createObjectURL(bl)); },'image/jpeg',0.92); }); }); }
  function liftNotes(){} /* the panel now sits at the top of the view, clear of the notes and the AR button */
  addEventListener('resize',liftNotes);
  var lastEnv=null;
  function applyTune(x,t,envToo){ if(!t) return;
    mv.exposure=t.exposure; mv.shadowIntensity=t.shadow; mv.shadowSoftness=t.soft;
    var mats=mv.model&&mv.model.materials; if(mats) mats.forEach(function(mt){ var p=mt.pbrMetallicRoughness; p.setBaseColorFactor([t.color,t.color,t.color,1]); p.setRoughnessFactor(t.rough); p.setMetallicFactor(t.metal); });
    if(envToo!==false){ clearTimeout(envTimer); envTimer=setTimeout(function(){ makeEnv(t).then(function(u){ if(cur!==x) return; mv.environmentImage=u; if(lastEnv) setTimeout(function(o){ URL.revokeObjectURL(o); }.bind(null,lastEnv),2000); lastEnv=u; }).catch(function(){}); },120); } }
  function buildTune(x){ var box=document.getElementById('tune'), grid=document.getElementById('tuneGrid'); var t=tuneOf(x.id);
    box.hidden=!(master&&t); liftNotes(); if(box.hidden) return; grid.innerHTML='';
    TROWS.forEach(function(r){ var l=document.createElement('label'); l.innerHTML='<span>'+r[1]+'</span><input type="range" min="'+r[2]+'" max="'+r[3]+'" step="'+r[4]+'"><output></output>'; var inp=l.querySelector('input'), out=l.querySelector('output');
      inp.value=t[r[0]]; out.textContent=(+t[r[0]]).toFixed(r[4]<1?2:0);
      inp.oninput=function(){ var v=+inp.value; out.textContent=v.toFixed(r[4]<1?2:0); var tt=tuneOf(x.id); tt[r[0]]=v; LOCAL[x.id]=tt; try{ localStorage.setItem(LKEY,JSON.stringify(LOCAL)); }catch(e){} applyTune(x,tt,/contrast|keyAmt|keyAz|keyEl|color/.test(r[0])); document.getElementById('tInfo').textContent='이 기기에 저장됨 · 모든 방문자에게 적용하려면 "홈페이지에 저장"'; };
      grid.appendChild(l); }); liftNotes(); }
  document.getElementById('tReset').onclick=function(){ if(!cur||!TDEF[cur.id]) return; var rb=document.getElementById('tReset'); if(!rb.dataset.arm){ rb.dataset.arm='1'; rb.textContent='한 번 더 누르면 초기화'; setTimeout(function(){ delete rb.dataset.arm; rb.textContent='기본값으로 초기화'; },3000); return; } delete rb.dataset.arm; rb.textContent='기본값으로 초기화'; /* no confirm() pop-up: it would break the AR camera view */ delete LOCAL[cur.id]; delete SITE[cur.id]; LOCAL[cur.id]=Object.assign({},TDEF[cur.id]); try{ localStorage.setItem(LKEY,JSON.stringify(LOCAL)); }catch(e){} buildTune(cur); applyTune(cur,tuneOf(cur.id)); document.getElementById('tInfo').textContent='기본값으로 되돌렸어요 (홈페이지에도 적용하려면 "홈페이지에 저장")'; };
  document.getElementById('tSave').onclick=async function(){ var info=function(t){ document.getElementById('tInfo').textContent=t; }; if(!cur) return;
    var cfg=null, token=''; try{ cfg=JSON.parse(localStorage.getItem('leeArchiveGhConfig_v2')||'null'); token=sessionStorage.getItem('leeArchiveGhToken_v2')||localStorage.getItem('leeArchiveGhTokenKeep_v2')||''; }catch(e){}
    if(!cfg||!cfg.owner||!cfg.repo||!token){ info('홈페이지 연결(GitHub)이 없어 이 기기에만 저장돼 있어요. 홈페이지 마스터 바의 ⇪ 버튼으로 한 번 연결한 뒤 다시 눌러 주세요.'); return; }
    info('홈페이지에 저장하는 중…');
    try{ await siteReady; var all=Object.assign({},SITE); Object.keys(TDEF).forEach(function(id){ var t=tuneOf(id); if(t) all[id]=t; });
      var path='ar-q7w2/settings.json', url='https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+'/contents/'+path, br=cfg.branch||'main', H={Authorization:'token '+token,Accept:'application/vnd.github+json'}, sha;
      var g=await fetch(url+'?ref='+encodeURIComponent(br)+'&_='+Date.now(),{headers:H,cache:'no-store'}); if(g.ok) sha=(await g.json()).sha;
      var txt=JSON.stringify({savedAt:Date.now(),tune:all},null,1), u=new TextEncoder().encode(txt), bin=''; for(var i=0;i<u.length;i++) bin+=String.fromCharCode(u[i]);
      var r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(Object.assign({message:'AR sculpture image settings',content:btoa(bin),branch:br},sha?{sha:sha}:{}))});
      if(!r.ok) throw new Error(r.status); SITE=all; var d=new Date(); info('홈페이지에 저장했어요 ('+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+') · 1분쯤 뒤 모든 방문자에게 적용돼요');
    }catch(e){ info('홈페이지 저장 실패 ('+e.message+'). 이 기기에는 저장돼 있어요. 잠시 뒤 다시 눌러 주세요.'); } };
  mv.addEventListener('load',function(){ if(cur&&TDEF[cur.id]) siteReady.then(function(){ applyTune(cur,tuneOf(cur.id)); }); });
  function close(){ view.classList.remove('on'); mv.removeAttribute('src'); cur=null; document.getElementById('tune').hidden=true; liftNotes(); }
  document.getElementById('back').onclick=function(){ if(history.state&&history.state.id) history.back(); else { close(); history.replaceState(null,'',location.pathname); } };
  addEventListener('popstate',function(){ var id=new URLSearchParams(location.search).get('id'), x=items.find(function(i){return i.id===id;}); if(x) open(x,false); else close(); });
  document.querySelectorAll('#tabs button').forEach(function(b){ b.onclick=function(){ kind=b.dataset.k; document.querySelectorAll('#tabs button').forEach(function(o){o.setAttribute('aria-pressed',String(o===b));}); render(); }; });
  mv.addEventListener('ar-status',function(e){ if(e.detail.status==='failed') alert('AR could not start on this device. / 이 기기에서는 AR을 열 수 없어요.'); });
  fetch('works.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ items=j.items.filter(function(x){ return master||!x.hidden; }); render();
    var id=new URLSearchParams(location.search).get('id'), x=items.find(function(i){return i.id===id;}); if(x){ kind=x.kind; render(); open(x,false); } });
})();
</script>
</body>
</html>
